<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Papely — Entrar</title>
<style>
:root {
  --pink: #d81b60;
  --pink-dark: #880e4f;
  --pink-light: #ec407a;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  min-height: 100vh;
  background:
    radial-gradient(ellipse 70% 55% at 15% 20%, rgba(252,228,236,0.95) 0%, transparent 55%),
    radial-gradient(ellipse 60% 70% at 90% 85%, rgba(248,187,208,0.75) 0%, transparent 55%),
    linear-gradient(180deg, #fff5f8 0%, #fef0f6 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.card {
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid rgba(255,255,255,0.95);
  border-radius: 28px;
  padding: 48px 44px;
  width: 100%;
  max-width: 400px;
  box-shadow:
    0 8px 48px rgba(216,27,96,0.12),
    0 2px 8px rgba(0,0,0,0.04),
    inset 0 1px 0 rgba(255,255,255,0.9);
}

.logo {
  text-align: center;
  margin-bottom: 36px;
}

.logo-icon {
  font-size: 44px;
  display: block;
  margin-bottom: 8px;
  line-height: 1;
}

.logo-text {
  font-size: 1.7rem;
  font-weight: 900;
  color: var(--pink);
  letter-spacing: -0.8px;
}

.logo-sub {
  font-size: 12px;
  color: var(--pink-dark);
  opacity: 0.45;
  margin-top: 4px;
  font-weight: 500;
  letter-spacing: 0.3px;
}

h1 {
  font-size: 1.25rem;
  font-weight: 800;
  color: var(--pink-dark);
  text-align: center;
  letter-spacing: -0.3px;
  margin-bottom: 4px;
}

.subtitle {
  font-size: 13px;
  color: #bbb;
  text-align: center;
  margin-bottom: 32px;
}

.field { margin-bottom: 16px; }

label {
  display: block;
  font-size: 10px;
  font-weight: 700;
  color: var(--pink-dark);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.7px;
}

input {
  width: 100%;
  padding: 13px 16px;
  border: 2px solid #f0f0f0;
  border-radius: 13px;
  font-size: 14px;
  outline: none;
  font-family: inherit;
  color: #333;
  background: rgba(255,255,255,0.8);
  transition: border-color 0.2s, box-shadow 0.2s;
}

input:focus {
  border-color: var(--pink-light);
  box-shadow: 0 0 0 3px rgba(236,64,122,0.10);
}

.btn {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--pink-light), var(--pink));
  color: white;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  margin-top: 8px;
  transition: opacity 0.2s, transform 0.1s;
  box-shadow: 0 6px 20px rgba(216,27,96,0.28);
  letter-spacing: -0.2px;
}

.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

.error {
  margin-top: 14px;
  padding: 12px 16px;
  background: #fff0f0;
  border: 1px solid #ffcdd2;
  border-radius: 11px;
  font-size: 13px;
  color: #c62828;
  text-align: center;
  display: none;
  font-weight: 600;
}

.error.visible { display: block; }
</style>
</head>
<body>

<div class="card">
  <div class="logo">
    <span class="logo-icon">💗</span>
    <div class="logo-text">Papely</div>
    <div class="logo-sub">Ferramentas criativas</div>
  </div>

  <h1>Entrar</h1>
  <p class="subtitle">Área restrita</p>

  <div class="field">
    <label>Usuário</label>
    <input type="text" id="user" autocomplete="username" autofocus placeholder="Digite seu usuário">
  </div>

  <div class="field">
    <label>Senha</label>
    <input type="password" id="password" autocomplete="current-password" placeholder="Digite sua senha">
  </div>

  <button class="btn" id="loginBtn" onclick="login()">Entrar</button>

  <div class="error" id="errorMsg">Usuário ou senha incorretos</div>
</div>

<script>
// Se já autenticado, vai direto para home
fetch('/api/auth/check').then(r => {
  if (r.ok) window.location.replace('/');
}).catch(() => {});

document.getElementById('password').addEventListener('keydown', e => {
  if (e.key === 'Enter') login();
});

document.getElementById('user').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('password').focus();
});

async function login() {
  const user     = document.getElementById('user').value.trim();
  const password = document.getElementById('password').value;
  const btn      = document.getElementById('loginBtn');
  const errorEl  = document.getElementById('errorMsg');

  if (!user || !password) return;

  btn.disabled    = true;
  btn.textContent = 'Entrando...';
  errorEl.classList.remove('visible');

  try {
    const res = await fetch('/api/auth/login', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ user, password }),
    });

    if (res.ok) {
      window.location.replace('/');
    } else {
      errorEl.textContent = 'Usuário ou senha incorretos';
      errorEl.classList.add('visible');
      document.getElementById('password').value = '';
      document.getElementById('password').focus();
    }
  } catch {
    errorEl.textContent = 'Erro de conexão. Verifique se o servidor está rodando.';
    errorEl.classList.add('visible');
  } finally {
    btn.disabled    = false;
    btn.textContent = 'Entrar';
  }
}
</script>

</body>
</html>
