<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Papely — Entrar</title>
<style>
/* Papely — Design System */
:root{--brand:#be185d;--brand-dark:#9d174d;--brand-bg:#fdf2f8;--text:#111827;--text-sec:#6b7280;--text-ter:#9ca3af;--border:#e5e7eb;--bg:#f9fafb;--white:#ffffff;--r:8px;--r-lg:12px;--shadow-sm:0 1px 3px rgba(0,0,0,0.07);--shadow:0 4px 12px rgba(0,0,0,0.08)}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5}
nav{background:var(--white);border-bottom:1px solid var(--border);height:56px;padding:0 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;gap:12px}
@media(max-width:640px){nav{padding:0 16px}}
.nav-logo{font-size:17px;font-weight:700;color:var(--brand);text-decoration:none;letter-spacing:-0.3px;flex-shrink:0}
.nav-logo:hover{opacity:.8}
.nav-sep{color:var(--text-ter);font-size:14px;flex-shrink:0}
.nav-page{font-size:14px;color:var(--text-sec);font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-logout{font-size:13px;font-weight:500;color:var(--text-sec);background:none;border:1px solid var(--border);border-radius:var(--r);padding:6px 14px;cursor:pointer;font-family:inherit;transition:background .15s,color .15s;flex-shrink:0;white-space:nowrap}
.btn-logout:hover{background:var(--bg);color:var(--text)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 18px;border-radius:var(--r);font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;transition:background .15s,opacity .15s,transform .1s;text-decoration:none;border:none;line-height:1}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-dark)}
.btn-outline{background:#fff;color:var(--brand);border:1px solid var(--brand)}
.btn-outline:hover{background:var(--brand-bg)}
.btn-ghost{background:transparent;color:var(--text-sec);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--bg);color:var(--text)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field label{font-size:13px;font-weight:500;color:var(--text)}
.field small{font-size:12px;color:var(--text-ter)}
.field input,.field textarea,.field select{padding:9px 12px;border:1px solid var(--border);border-radius:var(--r);font-size:14px;font-family:inherit;color:var(--text);background:var(--white);transition:border-color .15s,box-shadow .15s;outline:none}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(190,24,93,.1)}
.field textarea{resize:vertical;min-height:80px;line-height:1.5}
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-sm)}
</style>
<style>
body {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 24px;
}
.login-wrap {
  width: 100%;
  max-width: 360px;
}
.login-logo {
  text-align: center;
  margin-bottom: 36px;
}
.login-logo-text {
  font-size: 24px;
  font-weight: 700;
  color: var(--brand);
  letter-spacing: -0.5px;
}
.login-logo-sub {
  font-size: 13px;
  color: var(--text-ter);
  margin-top: 4px;
}
.login-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 28px;
  box-shadow: var(--shadow-sm);
}
.login-card h1 {
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.3px;
  margin-bottom: 4px;
}
.login-card .subtitle {
  font-size: 13px;
  color: var(--text-sec);
  margin-bottom: 24px;
}
.login-btn {
  width: 100%;
  padding: 11px;
  margin-top: 4px;
  font-size: 14px;
}
.error-msg {
  margin-top: 12px;
  padding: 10px 14px;
  background: #fef2f2;
  border: 1px solid #fecaca;
  border-radius: var(--r);
  font-size: 13px;
  color: #b91c1c;
  text-align: center;
  display: none;
  font-weight: 500;
}
.error-msg.visible { display: block; }
</style>
</head>
<body>

<div class="login-wrap">
  <div class="login-logo">
    <div class="login-logo-text">papely</div>
    <div class="login-logo-sub">Área restrita</div>
  </div>

  <div class="login-card">
    <h1>Entrar</h1>
    <p class="subtitle">Digite suas credenciais para continuar.</p>

    <div class="field">
      <label for="user">Usuário</label>
      <input type="text" id="user" autocomplete="username" autofocus placeholder="Seu usuário">
    </div>

    <div class="field">
      <label for="password">Senha</label>
      <input type="password" id="password" autocomplete="current-password" placeholder="Sua senha">
    </div>

    <button class="btn btn-primary login-btn" id="loginBtn" onclick="login()">Entrar</button>
    <div class="error-msg" id="errorMsg"></div>
  </div>
</div>

<script>
fetch('/api/auth/check').then(r => {
  if (r.ok) window.location.replace('/');
}).catch(() => {});

document.getElementById('password').addEventListener('keydown', e => {
  if (e.key === 'Enter') login();
});
document.getElementById('user').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('password').focus();
});

async function login() {
  const user     = document.getElementById('user').value.trim();
  const password = document.getElementById('password').value;
  const btn      = document.getElementById('loginBtn');
  const errorEl  = document.getElementById('errorMsg');

  if (!user || !password) return;

  btn.disabled    = true;
  btn.textContent = 'Entrando...';
  errorEl.classList.remove('visible');

  try {
    const res = await fetch('/api/auth/login', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ user, password }),
    });
    if (res.ok) {
      window.location.replace('/');
    } else {
      const data = await res.json().catch(() => ({}));
      errorEl.textContent = data.error || 'Usuário ou senha incorretos';
      errorEl.classList.add('visible');
      document.getElementById('password').value = '';
      document.getElementById('password').focus();
    }
  } catch {
    errorEl.textContent = 'Erro de conexão. Tente novamente.';
    errorEl.classList.add('visible');
  } finally {
    btn.disabled    = false;
    btn.textContent = 'Entrar';
  }
}
</script>
</body>
</html>
