<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Papely — Entrar</title>
<link rel="stylesheet" href="/styles.css">
<style>
body {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 24px;
}
.login-wrap {
  width: 100%;
  max-width: 360px;
}
.login-logo {
  text-align: center;
  margin-bottom: 36px;
}
.login-logo-text {
  font-size: 24px;
  font-weight: 700;
  color: var(--brand);
  letter-spacing: -0.5px;
}
.login-logo-sub {
  font-size: 13px;
  color: var(--text-ter);
  margin-top: 4px;
}
.login-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 28px;
  box-shadow: var(--shadow-sm);
}
.login-card h1 {
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.3px;
  margin-bottom: 4px;
}
.login-card .subtitle {
  font-size: 13px;
  color: var(--text-sec);
  margin-bottom: 24px;
}
.login-btn {
  width: 100%;
  padding: 11px;
  margin-top: 4px;
  font-size: 14px;
}
.error-msg {
  margin-top: 12px;
  padding: 10px 14px;
  background: #fef2f2;
  border: 1px solid #fecaca;
  border-radius: var(--r);
  font-size: 13px;
  color: #b91c1c;
  text-align: center;
  display: none;
  font-weight: 500;
}
.error-msg.visible { display: block; }
</style>
</head>
<body>

<div class="login-wrap">
  <div class="login-logo">
    <div class="login-logo-text">papely</div>
    <div class="login-logo-sub">Área restrita</div>
  </div>

  <div class="login-card">
    <h1>Entrar</h1>
    <p class="subtitle">Digite suas credenciais para continuar.</p>

    <div class="field">
      <label for="user">Usuário</label>
      <input type="text" id="user" autocomplete="username" autofocus placeholder="Seu usuário">
    </div>

    <div class="field">
      <label for="password">Senha</label>
      <input type="password" id="password" autocomplete="current-password" placeholder="Sua senha">
    </div>

    <button class="btn btn-primary login-btn" id="loginBtn" onclick="login()">Entrar</button>
    <div class="error-msg" id="errorMsg"></div>
  </div>
</div>

<script>
fetch('/api/auth/check').then(r => {
  if (r.ok) window.location.replace('/');
}).catch(() => {});

document.getElementById('password').addEventListener('keydown', e => {
  if (e.key === 'Enter') login();
});
document.getElementById('user').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('password').focus();
});

async function login() {
  const user     = document.getElementById('user').value.trim();
  const password = document.getElementById('password').value;
  const btn      = document.getElementById('loginBtn');
  const errorEl  = document.getElementById('errorMsg');

  if (!user || !password) return;

  btn.disabled    = true;
  btn.textContent = 'Entrando...';
  errorEl.classList.remove('visible');

  try {
    const res = await fetch('/api/auth/login', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ user, password }),
    });
    if (res.ok) {
      window.location.replace('/');
    } else {
      const data = await res.json().catch(() => ({}));
      errorEl.textContent = data.error || 'Usuário ou senha incorretos';
      errorEl.classList.add('visible');
      document.getElementById('password').value = '';
      document.getElementById('password').focus();
    }
  } catch {
    errorEl.textContent = 'Erro de conexão. Tente novamente.';
    errorEl.classList.add('visible');
  } finally {
    btn.disabled    = false;
    btn.textContent = 'Entrar';
  }
}
</script>
</body>
</html>
