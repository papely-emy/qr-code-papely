<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Papely — Entrar</title>
<style>
:root {
  --pink:       #d81b60;
  --pink-dark:  #880e4f;
  --pink-light: #ec407a;
  --pink-pale:  #fce4ec;
  --pink-mid:   #f8bbd0;
  --bg:         #fff5f8;
  --white:      #ffffff;
  --text:       #1a0a14;
  --text-sec:   #6d3358;
  --text-ter:   #c08ea0;
  --border:     rgba(216,27,96,0.16);
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  color: var(--text);
}

.wrap {
  width: 100%;
  max-width: 360px;
}

.logo {
  text-align: center;
  margin-bottom: 32px;
}
.logo-text {
  font-size: 28px;
  font-weight: 900;
  color: var(--pink);
  letter-spacing: -0.8px;
  display: block;
}
.logo-sub {
  font-size: 13px;
  color: var(--text-ter);
  margin-top: 4px;
}

.card {
  background: var(--white);
  border: 1.5px solid var(--border);
  border-radius: 20px;
  padding: 32px 30px;
  box-shadow: 0 8px 32px rgba(216,27,96,0.09);
}

.card h1 {
  font-size: 18px;
  font-weight: 800;
  color: var(--text);
  letter-spacing: -0.3px;
  margin-bottom: 4px;
}
.card .subtitle {
  font-size: 13px;
  color: var(--text-ter);
  margin-bottom: 24px;
}

.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field label {
  font-size: 12px;
  font-weight: 700;
  color: var(--text-sec);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.field input {
  padding: 11px 14px;
  border: 1.5px solid rgba(216,27,96,0.18);
  border-radius: 10px;
  font-size: 14px;
  font-family: inherit;
  color: var(--text);
  background: var(--white);
  transition: border-color 0.15s, box-shadow 0.15s;
  outline: none;
}
.field input:focus {
  border-color: var(--pink-light);
  box-shadow: 0 0 0 3px rgba(236,64,122,0.12);
}
.field input::placeholder { color: var(--text-ter); }

.btn-login {
  width: 100%;
  padding: 13px;
  border: none;
  border-radius: 10px;
  background: var(--pink);
  color: white;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  margin-top: 6px;
  transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
  box-shadow: 0 4px 16px rgba(216,27,96,0.28);
  letter-spacing: -0.2px;
}
.btn-login:hover { background: var(--pink-dark); box-shadow: 0 6px 20px rgba(216,27,96,0.34); }
.btn-login:active { transform: scale(0.98); }
.btn-login:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

.error-msg {
  margin-top: 12px;
  padding: 10px 14px;
  background: #fff0f4;
  border: 1px solid rgba(216,27,96,0.2);
  border-radius: 8px;
  font-size: 13px;
  color: var(--pink-dark);
  text-align: center;
  display: none;
  font-weight: 600;
}
.error-msg.visible { display: block; }
</style>
</head>
<body>

<div class="wrap">
  <div class="logo">
    <span class="logo-text">papely</span>
    <span class="logo-sub">Área restrita</span>
  </div>

  <div class="card">
    <h1>Entrar</h1>
    <p class="subtitle">Digite suas credenciais para continuar.</p>

    <div class="field">
      <label for="user">Usuário</label>
      <input type="text" id="user" autocomplete="username" autofocus placeholder="Seu usuário">
    </div>

    <div class="field">
      <label for="password">Senha</label>
      <input type="password" id="password" autocomplete="current-password" placeholder="Sua senha">
    </div>

    <button class="btn-login" id="loginBtn" onclick="login()">Entrar</button>
    <div class="error-msg" id="errorMsg"></div>
  </div>
</div>

<script>
fetch('/api/auth/check').then(r => {
  if (r.ok) window.location.replace('/');
}).catch(() => {});

document.getElementById('password').addEventListener('keydown', e => {
  if (e.key === 'Enter') login();
});
document.getElementById('user').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('password').focus();
});

async function login() {
  const user     = document.getElementById('user').value.trim();
  const password = document.getElementById('password').value;
  const btn      = document.getElementById('loginBtn');
  const errorEl  = document.getElementById('errorMsg');

  if (!user || !password) return;

  btn.disabled    = true;
  btn.textContent = 'Entrando...';
  errorEl.classList.remove('visible');

  try {
    const res = await fetch('/api/auth/login', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ user, password }),
    });
    if (res.ok) {
      window.location.replace('/');
    } else {
      const data = await res.json().catch(() => ({}));
      errorEl.textContent = data.error || 'Usuário ou senha incorretos';
      errorEl.classList.add('visible');
      document.getElementById('password').value = '';
      document.getElementById('password').focus();
    }
  } catch {
    errorEl.textContent = 'Erro de conexão. Tente novamente.';
    errorEl.classList.add('visible');
  } finally {
    btn.disabled    = false;
    btn.textContent = 'Entrar';
  }
}
</script>
</body>
</html>
