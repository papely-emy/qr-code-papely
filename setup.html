<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Papely — Configuração Inicial</title>
<style>
:root {
  --pink: #d81b60;
  --pink-dark: #880e4f;
  --pink-light: #ec407a;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  min-height: 100vh;
  background:
    radial-gradient(ellipse 70% 55% at 15% 20%, rgba(252,228,236,0.95) 0%, transparent 55%),
    radial-gradient(ellipse 60% 70% at 90% 85%, rgba(248,187,208,0.75) 0%, transparent 55%),
    linear-gradient(180deg, #fff5f8 0%, #fef0f6 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.card {
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid rgba(255,255,255,0.95);
  border-radius: 28px;
  padding: 48px 44px;
  width: 100%;
  max-width: 440px;
  box-shadow:
    0 8px 48px rgba(216,27,96,0.12),
    0 2px 8px rgba(0,0,0,0.04),
    inset 0 1px 0 rgba(255,255,255,0.9);
}

.logo {
  text-align: center;
  margin-bottom: 28px;
}

.logo-icon { font-size: 44px; display: block; margin-bottom: 8px; line-height: 1; }
.logo-text { font-size: 1.7rem; font-weight: 900; color: var(--pink); letter-spacing: -0.8px; }

h1 {
  font-size: 1.2rem;
  font-weight: 800;
  color: var(--pink-dark);
  text-align: center;
  margin-bottom: 6px;
}

.subtitle {
  font-size: 13px;
  color: #bbb;
  text-align: center;
  margin-bottom: 28px;
  line-height: 1.6;
}

.token-hint {
  background: #fff8fb;
  border: 1px solid rgba(216,27,96,0.2);
  border-radius: 12px;
  padding: 12px 16px;
  font-size: 12px;
  color: var(--pink-dark);
  margin-bottom: 24px;
  line-height: 1.7;
}

.token-hint strong { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px; }
.token-hint code { font-family: monospace; font-size: 13px; background: rgba(216,27,96,0.07); padding: 1px 6px; border-radius: 4px; }

.field { margin-bottom: 16px; }

label {
  display: block;
  font-size: 10px;
  font-weight: 700;
  color: var(--pink-dark);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.7px;
}

input {
  width: 100%;
  padding: 13px 16px;
  border: 2px solid #f0f0f0;
  border-radius: 13px;
  font-size: 14px;
  outline: none;
  font-family: inherit;
  color: #333;
  background: rgba(255,255,255,0.8);
  transition: border-color 0.2s, box-shadow 0.2s;
}

input:focus {
  border-color: var(--pink-light);
  box-shadow: 0 0 0 3px rgba(236,64,122,0.10);
}

.btn {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--pink-light), var(--pink));
  color: white;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  margin-top: 8px;
  transition: opacity 0.2s, transform 0.1s;
  box-shadow: 0 6px 20px rgba(216,27,96,0.28);
}

.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

.msg {
  margin-top: 14px;
  padding: 12px 16px;
  border-radius: 11px;
  font-size: 13px;
  text-align: center;
  font-weight: 600;
  display: none;
}

.msg.error   { background: #fff0f0; border: 1px solid #ffcdd2; color: #c62828; }
.msg.success { background: #f0fff4; border: 1px solid #bbf7d0; color: #166534; }
.msg.visible { display: block; }

/* Done state */
.done-state { text-align: center; }
.done-state .done-icon { font-size: 56px; display: block; margin-bottom: 16px; }
.done-state h2 { font-size: 1.2rem; font-weight: 800; color: var(--pink-dark); margin-bottom: 8px; }
.done-state p  { font-size: 13px; color: #bbb; margin-bottom: 24px; }
.btn-login {
  display: inline-block;
  background: linear-gradient(135deg, var(--pink-light), var(--pink));
  color: white;
  padding: 13px 32px;
  border-radius: 50px;
  font-weight: 700;
  font-size: 14px;
  text-decoration: none;
  box-shadow: 0 4px 16px rgba(216,27,96,0.28);
}
</style>
</head>
<body>

<div class="card">
  <div class="logo">
    <span class="logo-icon">💗</span>
    <div class="logo-text">Papely</div>
  </div>

  <!-- Form de setup -->
  <div id="setupForm">
    <h1>Configuração Inicial</h1>
    <p class="subtitle">Crie sua conta de acesso ao Papely.<br>Isso só acontece uma vez.</p>

    <div class="token-hint">
      <strong>Token de segurança</strong>
      Cole o token que apareceu no <code>console do servidor</code> ao iniciar.
    </div>

    <div class="field">
      <label>Token do servidor</label>
      <input type="text" id="token" placeholder="Cole o token aqui" autocomplete="off">
    </div>

    <div class="field">
      <label>Usuário</label>
      <input type="text" id="username" placeholder="Ex: papely" autocomplete="username">
    </div>

    <div class="field">
      <label>Senha <span style="opacity:.5;font-size:9px;text-transform:none;letter-spacing:0">(mínimo 6 caracteres)</span></label>
      <input type="password" id="password" placeholder="Crie uma senha segura" autocomplete="new-password">
    </div>

    <div class="field">
      <label>Confirmar senha</label>
      <input type="password" id="confirm" placeholder="Repita a senha" autocomplete="new-password">
    </div>

    <button class="btn" id="setupBtn" onclick="setup()">Criar conta</button>

    <div class="msg error"   id="errorMsg"></div>
    <div class="msg success" id="successMsg"></div>
  </div>

  <!-- Estado: setup já foi feito -->
  <div id="doneState" class="done-state" style="display:none;">
    <span class="done-icon">✅</span>
    <h2>Conta já configurada</h2>
    <p>O setup já foi concluído. Faça login para continuar.</p>
    <a href="/login.html" class="btn-login">Ir para o login</a>
  </div>
</div>

<script>
// Verifica se setup ainda é necessário
fetch('/api/auth/setup-status').then(r => r.json()).then(({ needsSetup }) => {
  if (!needsSetup) {
    document.getElementById('setupForm').style.display = 'none';
    document.getElementById('doneState').style.display = 'block';
  }
}).catch(() => {});

async function setup() {
  const token    = document.getElementById('token').value.trim();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const confirm  = document.getElementById('confirm').value;
  const btn      = document.getElementById('setupBtn');
  const errorEl  = document.getElementById('errorMsg');
  const successEl= document.getElementById('successMsg');

  errorEl.classList.remove('visible');
  successEl.classList.remove('visible');

  if (!token)    return showError('Cole o token que apareceu no console do servidor.');
  if (!username) return showError('Preencha o usuário.');
  if (!password) return showError('Preencha a senha.');
  if (password !== confirm) return showError('As senhas não coincidem.');
  if (password.length < 6)  return showError('A senha deve ter pelo menos 6 caracteres.');

  btn.disabled    = true;
  btn.textContent = 'Criando conta...';

  try {
    const res = await fetch('/api/auth/setup', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ token, username, password }),
    });

    const data = await res.json();

    if (!res.ok) {
      showError(data.error || 'Erro ao criar conta.');
      return;
    }

    successEl.textContent = '✅ Conta criada! Redirecionando...';
    successEl.classList.add('visible');
    setTimeout(() => window.location.replace('/login.html'), 1500);
  } catch {
    showError('Erro de conexão.');
  } finally {
    btn.disabled    = false;
    btn.textContent = 'Criar conta';
  }
}

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.classList.add('visible');
}
</script>

</body>
</html>
