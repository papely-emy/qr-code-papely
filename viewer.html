<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Papely — Abrindo PDF</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: radial-gradient(ellipse at 20% 20%, #fce4ec 0%, #f8bbd0 40%, #fce4ec 70%, #fff0f5 100%);
}

.card {
  background: white;
  border-radius: 28px;
  padding: 48px 36px;
  text-align: center;
  max-width: 380px;
  width: 100%;
  box-shadow: 0 8px 40px rgba(216, 27, 96, 0.14);
  animation: fadeIn 0.35s ease both;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}

.icon { font-size: 56px; margin-bottom: 16px; display: block; }

h2 {
  font-size: 1.3rem;
  font-weight: 800;
  color: #880e4f;
  margin-bottom: 8px;
  letter-spacing: -0.3px;
}

p {
  font-size: 14px;
  color: #bbb;
  line-height: 1.6;
  margin-bottom: 28px;
}

.btn {
  display: inline-block;
  background: linear-gradient(135deg, #ec407a, #d81b60);
  color: white;
  border: none;
  padding: 14px 36px;
  border-radius: 50px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  transition: opacity 0.2s, transform 0.1s;
  text-decoration: none;
}

.btn:hover { opacity: 0.9; }
.btn:active { transform: scale(0.97); }

.back {
  display: block;
  margin-top: 16px;
  font-size: 12px;
  color: #ccc;
  text-decoration: none;
}

.back:hover { color: #d81b60; }
</style>
</head>
<body>

<div class="card">
  <span class="icon">📄</span>
  <h2>Abrindo seu PDF</h2>
  <p id="msg">Você será redirecionado automaticamente...</p>
  <button class="btn" onclick="abrir()">Abrir PDF</button>
  <a href="/" class="back">← Voltar para o início</a>
</div>

<script>
const params  = new URLSearchParams(window.location.search);
const fileUrl = params.get("file");
const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

if (!fileUrl) {
  document.getElementById('msg').textContent = 'Nenhum arquivo encontrado neste link.';
}

function abrir() {
  if (!fileUrl) return;
  if (isMobile) {
    window.location.href = "https://docs.google.com/viewer?url=" + encodeURIComponent(fileUrl);
  } else {
    window.location.href = fileUrl;
  }
}

if (fileUrl) setTimeout(abrir, 800);
</script>

</body>
</html>
