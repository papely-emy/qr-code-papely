apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: papely-ingress
spec:
  rules:
    - host: papely-qrcode.site
      http:
        paths:
          # API routes — handled by Node.js backend
          - path: /upload
            pathType: Prefix
            backend:
              service:
                name: papely-backend
                port:
                  number: 80

          - path: /files
            pathType: Prefix
            backend:
              service:
                name: papely-backend
                port:
                  number: 80

          - path: /convite/
            pathType: Prefix
            backend:
              service:
                name: papely-backend
                port:
                  number: 80

          - path: /hotspot/
            pathType: Prefix
            backend:
              service:
                name: papely-backend
                port:
                  number: 80

          - path: /qrcode
            pathType: Prefix
            backend:
              service:
                name: papely-backend
                port:
                  number: 80

          # Static frontend — served by Nginx
          - path: /
            pathType: Prefix
            backend:
              service:
                name: papely-service
                port:
                  number: 80
