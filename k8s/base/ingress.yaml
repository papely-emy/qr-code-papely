apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: papely-ingress
spec:
  rules:
    - host: papely-qrcode.site
      http:
        paths:
          # Todas as rotas da API vão para o backend Node.js
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: papely-backend
                port:
                  number: 80

          # Tudo mais (HTML, CSS, JS) vai para o frontend Nginx
          - path: /
            pathType: Prefix
            backend:
              service:
                name: papely-service
                port:
                  number: 80
