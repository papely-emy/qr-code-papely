<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Papely — QR Code</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<link rel="stylesheet" href="/styles.css">
<style>
:root {
  --pink: #be185d;
  --pink-dark: #9d174d;
  --pink-light: #ec407a;
}

body {
  padding-top: 32px;
  padding-bottom: 48px;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-left: 20px;
  padding-right: 20px;
}

/* CARD */
.card {
  background: white;
  border-radius: 24px;
  padding: 32px;
  width: 100%;
  max-width: 500px;
  box-shadow: 0 4px 24px rgba(216, 27, 96, 0.12);
}

.card-header { margin-bottom: 28px; }

.card-header h1 {
  font-size: 1.5rem;
  font-weight: 800;
  color: var(--pink-dark);
  letter-spacing: -0.5px;
}

.card-header p {
  font-size: 0.85rem;
  color: #bbb;
  margin-top: 4px;
}

/* SECTION TABS */
.tabs {
  display: flex;
  background: #f7f7f7;
  border-radius: 12px;
  padding: 4px;
  margin-bottom: 24px;
}

.tab {
  flex: 1;
  padding: 9px;
  border: none;
  background: transparent;
  border-radius: 9px;
  font-size: 13px;
  font-weight: 600;
  color: #aaa;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.2s;
}

.tab.active {
  background: white;
  color: var(--pink);
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

/* PANELS */
.panel { display: none; }
.panel.active { display: block; }

/* FIELDS */
.field { margin-bottom: 16px; }

label {
  display: block;
  font-size: 11px;
  font-weight: 700;
  color: var(--pink-dark);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

input[type="url"],
input[type="text"] {
  width: 100%;
  padding: 12px 14px;
  border: 2px solid #f0f0f0;
  border-radius: 12px;
  font-size: 14px;
  outline: none;
  font-family: inherit;
  transition: border-color 0.2s;
  color: #333;
}

input[type="url"]:focus,
input[type="text"]:focus {
  border-color: var(--pink-light);
}

input[type="file"] {
  width: 100%;
  padding: 12px;
  border: 2px dashed #f5c6da;
  border-radius: 12px;
  font-size: 13px;
  color: #aaa;
  cursor: pointer;
  font-family: inherit;
  background: #fff8fb;
}

.color-row {
  display: flex;
  align-items: center;
  gap: 12px;
}

input[type="color"] {
  width: 44px;
  height: 44px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  padding: 3px;
  background: none;
}

.color-hex {
  font-size: 13px;
  color: #888;
  font-weight: 600;
}

/* BUTTONS */
.btn {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  transition: opacity 0.2s, transform 0.1s;
}

.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

.btn-primary {
  background: linear-gradient(135deg, var(--pink-light), var(--pink));
  color: white;
}

.btn-ghost {
  background: #f5f5f5;
  color: var(--pink-dark);
  margin-top: 8px;
}

.btn-cloud {
  background: #f0fdf4;
  color: #166534;
  border: 1.5px solid #bbf7d0;
}
.btn-cloud:hover { background: #dcfce7; }

#saveStatus {
  font-size: 12px;
  text-align: center;
  margin-top: 8px;
  min-height: 18px;
  font-weight: 600;
}

/* QR RESULT */
.qr-result {
  display: none;
  padding-top: 24px;
  margin-top: 24px;
  border-top: 1px solid #f5f5f5;
  text-align: center;
}

.qr-result.visible { display: block; }

.qr-result canvas {
  max-width: 220px;
  width: 100%;
  aspect-ratio: 1;
  border-radius: 16px;
  padding: 10px;
  background: white;
  box-shadow: 0 4px 20px rgba(216, 27, 96, 0.12);
  margin-bottom: 20px;
}

.qr-url-preview {
  font-size: 11px;
  color: #bbb;
  word-break: break-all;
  background: #f9f9f9;
  padding: 8px 12px;
  border-radius: 8px;
  margin-bottom: 16px;
  text-align: left;
}
</style>
</head>
<body>
<style id="auth-veil">body{visibility:hidden}</style>
<script>
(async()=>{
  try{
    const r=await fetch('/api/auth/check');
    if(!r.ok){window.location.replace('/login');return;}
    document.getElementById('auth-veil').remove();
  }catch{window.location.replace('/login');}
})();
</script>

<nav>
  <a href="/" class="nav-logo">papely</a>
  <span class="nav-sep">/</span>
  <span class="nav-page">QR Code</span>
  <button class="btn-logout" onclick="sair()">Sair</button>
</nav>

<div style="width:100%;max-width:500px;margin-top:32px">
<div class="card">
  <div class="card-header">
    <h1>Gerador de QR Code</h1>
    <p>Personalize a cor e compartilhe em segundos</p>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="mudarTab('link', this)">Link</button>
    <button class="tab" onclick="mudarTab('pdf', this)">PDF</button>
  </div>

  <!-- Tab: Link -->
  <div id="panel-link" class="panel active">
    <div class="field">
      <label>URL</label>
      <input type="url" id="url" placeholder="https://seusite.com.br">
    </div>

    <div class="field">
      <label>Cor do QR</label>
      <div class="color-row">
        <input type="color" id="color" value="#d81b60">
        <span class="color-hex" id="colorHex">#d81b60</span>
      </div>
    </div>

    <button class="btn btn-primary" onclick="gerarQR()">Gerar QR Code</button>
  </div>

  <!-- Tab: PDF -->
  <div id="panel-pdf" class="panel">
    <div class="field">
      <label>Arquivo PDF</label>
      <input type="file" id="pdf" accept="application/pdf">
    </div>

    <div class="field">
      <label>Cor do QR</label>
      <div class="color-row">
        <input type="color" id="colorPdf" value="#d81b60">
        <span class="color-hex" id="colorPdfHex">#d81b60</span>
      </div>
    </div>

    <button class="btn btn-primary" id="uploadBtn" onclick="uploadPDF()">Enviar PDF e Gerar QR</button>
  </div>

  <!-- QR Result -->
  <div class="qr-result" id="qrResult">
    <canvas id="qrCanvas"></canvas>
    <div class="qr-url-preview" id="qrUrlPreview"></div>

    <div class="field">
      <label>Nome do arquivo para download</label>
      <input type="text" id="filename" placeholder="meu_qrcode">
    </div>

    <button class="btn btn-ghost" onclick="baixar()">Baixar QR Code (.png)</button>
    <button class="btn btn-ghost btn-cloud" id="saveBtn" onclick="salvarQR()">Salvar no Supabase ☁️</button>
    <div id="saveStatus"></div>
  </div>
</div>
</div>

<script>
const colorInput    = document.getElementById("color");
const colorHex      = document.getElementById("colorHex");
const colorPdfInput = document.getElementById("colorPdf");
const colorPdfHex   = document.getElementById("colorPdfHex");
const canvas        = document.getElementById("qrCanvas");
const uploadBtn     = document.getElementById("uploadBtn");
const qrResult      = document.getElementById("qrResult");
const qrUrlPreview  = document.getElementById("qrUrlPreview");
const pdfInput      = document.getElementById("pdf");

// Estado do QR atual — usado ao salvar
let qrTipo = "link";
let qrUrl  = "";
let qrCor  = "#d81b60";

colorInput.addEventListener("input",    () => { colorHex.textContent    = colorInput.value; });
colorPdfInput.addEventListener("input", () => { colorPdfHex.textContent = colorPdfInput.value; });

function mudarTab(tab, btn) {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
  btn.classList.add("active");
  document.getElementById("panel-" + tab).classList.add("active");
}

function renderQR(url, color, tipo = "link") {
  qrTipo = tipo;
  qrUrl  = url;
  qrCor  = color;

  qrResult.classList.add("visible");
  qrUrlPreview.textContent = url;
  document.getElementById("saveStatus").textContent = "";

  setTimeout(() => {
    QRCode.toCanvas(canvas, url, {
      width: 260,
      margin: 2,
      color: { dark: color, light: "#ffffff" }
    });
  }, 0);
}

function gerarQR() {
  let url = document.getElementById("url").value.trim();
  if (!url) { alert("Coloca um link 😅"); return; }
  if (!url.startsWith("http")) url = "https://" + url;
  try { new URL(url); } catch { alert("URL inválida 😕"); return; }
  renderQR(url, colorInput.value, "link");
}

async function uploadPDF() {
  const file = pdfInput.files[0];
  if (!file) { alert("Escolhe um PDF 😅"); return; }

  uploadBtn.textContent = "Enviando... ⏳";
  uploadBtn.disabled = true;

  try {
    const formData = new FormData();
    formData.append("file", file);

    const res = await fetch("/api/upload", { method: "POST", body: formData });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || "Erro no upload");
    }

    const data = await res.json();
    const viewerUrl = window.location.origin + "/viewer.html?file=" + encodeURIComponent(data.url);
    renderQR(viewerUrl, colorPdfInput.value, "pdf");
    alert("PDF enviado! QR gerado 🚀");
  } catch (err) {
    alert("Erro: " + err.message);
  } finally {
    uploadBtn.textContent = "Enviar PDF e Gerar QR";
    uploadBtn.disabled = false;
  }
}

function baixar() {
  if (!canvas.width) { alert("Gera um QR primeiro 😊"); return; }
  const filename = document.getElementById("filename").value.trim() || "papely_qrcode";
  const link = document.createElement("a");
  link.download = filename + ".png";
  link.href = canvas.toDataURL();
  link.click();
}

async function salvarQR() {
  if (!canvas.width) { alert("Gera um QR primeiro 😊"); return; }

  const saveBtn    = document.getElementById("saveBtn");
  const saveStatus = document.getElementById("saveStatus");
  const nome       = document.getElementById("filename").value.trim() || "qrcode";

  saveBtn.disabled    = true;
  saveBtn.textContent = "Salvando... ⏳";
  saveStatus.textContent = "";
  saveStatus.className = "";

  try {
    const res = await fetch("/api/qrcode", {
      method:  "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        tipo:        qrTipo,
        urlDestino:  qrUrl,
        nome,
        cor:         qrCor,
        imagemBase64: canvas.toDataURL("image/png"),
      }),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || "Erro ao salvar");
    }

    saveStatus.textContent = "✅ Salvo no Supabase!";
    saveStatus.style.color = "#4caf50";
  } catch (err) {
    saveStatus.textContent = "❌ " + err.message;
    saveStatus.style.color = "#e53935";
  } finally {
    saveBtn.disabled    = false;
    saveBtn.textContent = "Salvar no Supabase ☁️";
  }
}

async function sair() {
  await fetch('/api/auth/logout', { method: 'POST' }).catch(()=>{});
  window.location.replace('/login');
}
</script>

</body>
</html>
